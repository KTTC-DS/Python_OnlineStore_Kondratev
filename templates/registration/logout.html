{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="text-center">
            <div class="mb-4">
                <!-- Иконка выхода -->
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="currentColor" class="text-muted" viewBox="0 0 16 16">
